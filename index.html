<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A private, interactive ML system design study atlas.">
  <title>ML Systems Atlas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div><strong>ML Systems Atlas</strong><span>Private study workspace</span></div>
      </div>
      <label class="search"><span>⌕</span><input id="searchInput" placeholder="Search concepts and systems…"></label>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <div class="progress-row"><span>Your progress</span><strong id="progressText">0%</strong></div>
        <div class="progress-track"><div id="progressBar"></div></div>
        <button class="ghost wide" id="resetProgress">Reset progress</button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="Toggle navigation">☰</button>
        <div class="breadcrumbs" id="breadcrumbs">Atlas / Overview</div>
        <div class="top-actions">
          <button class="ghost" id="randomPrompt">Practice prompt</button>
          <button class="primary" id="markComplete">Mark complete</button>
        </div>
      </header>
      <div id="content" class="content"></div>
    </main>
  </div>

  <dialog id="promptDialog">
    <button class="dialog-close" id="closeDialog" aria-label="Close">×</button>
    <span class="eyebrow">INTERVIEW MODE</span>
    <h2 id="promptTitle"></h2>
    <p id="promptBody"></p>
    <details><summary>What a strong answer should cover</summary><ul id="promptRubric"></ul></details>
    <button class="primary" id="nextPrompt">Give me another</button>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
